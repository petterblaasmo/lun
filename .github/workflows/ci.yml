name: CI

# Every pull request and every push to main: does it build, and do the unit
# tests pass. The tests are reported but do not fail the run yet: a few are
# known to depend on the order they run in, or to die in WebKit's display
# link (issue 98). When those are fixed, take `continue-on-error` away.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build the app and the tests
        run: swift build --build-tests 2>&1 | tail -40

  test:
    name: Unit tests
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests, in parts
        run: |
          status=0
          for part in "A-B" "C-D" "E-F" "G-M" "N-R" "S" "T-V" "W-Z"; do
            echo "::group::SearchTests.[$part]"
            if ! swift test --filter "SearchTests\.[$part]" 2>&1 | tail -60; then status=1; fi
            echo "::endgroup::"
          done
          exit $status
        shell: bash
